<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroLeadAI · Mindex Property Intelligence</title><style>body{margin:0;font:15px system-ui;background:#081725;color:#e9f2fc}header{padding:24px 4vw;border-bottom:1px solid #294056}h1{margin:0}small,p{color:#9bb3c5}main{display:grid;grid-template-columns:minmax(300px,37%) 1fr;gap:20px;padding:20px 4vw}input,select{background:#142b3c;color:white;padding:12px;border:1px solid #38536b;border-radius:8px}#list{max-height:75vh;overflow:auto}button{display:block;width:100%;text-align:left;padding:13px;margin:5px 0;border:1px solid #29465a;background:#112a3c;color:white;border-radius:10px;cursor:pointer}button:hover{background:#21465e}.badge{display:inline-block;background:#2a485b;padding:3px 8px;border-radius:20px;font-size:12px}section{background:#102738;border:1px solid #29465a;border-radius:12px;padding:20px}dl{display:grid;grid-template-columns:160px 1fr;gap:12px}dt{color:#9ab8ca}dd{margin:0;overflow-wrap:anywhere}a{color:#80d6fd}#notice{color:#fabd76}@media(max-width:800px){main{display:block}section{margin-top:18px}#list{max-height:40vh}dl{grid-template-columns:1fr}}</style></head><body><header><h1>AeroLeadAI · Mindex property intelligence</h1><p>Verified public-source evidence and transparent prospecting priority. Missing source evidence remains unknown.</p><a href="/">← Network</a> <span id="count"></span></header><main><div><input id="q" placeholder="Address or parcel PIN" aria-label="Search property" style="width:67%"><select id="tier" aria-label="Priority tier"><option value="">All tiers</option><option>A</option><option>B</option><option>C</option></select><p id="notice"></p><div id="list"></div></div><section id="detail" aria-live="polite">Select a property to inspect its sources.</section></main><script>
const $=x=>document.getElementById(x);let cards=[];
const e=(x)=>String(x??'Not verified').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const source=(v)=>v?.status==='SOURCE_RECORDED'?e(typeof v.value==='object'?JSON.stringify(v.value):v.value):'Not verified';
function detail(c){const m=c.mindex||{},a=c.imagery||{},p=c.permit||{},s=c.storm||{};const maps=c.street_view_url&&/^https:\/\/www\.google\.com\/maps\//.test(c.street_view_url)?'<a target="_blank" rel="noopener noreferrer" href="'+e(c.street_view_url)+'">Google Street View ↗</a>':'Not available';$('detail').innerHTML='<h2>'+e(c.address||c.county_pin)+'</h2><span class="badge">Tier '+e(m.tier)+'</span> <span class="badge">Priority '+e(m.prospecting_priority)+'</span><p>Prospecting priority only, not a roof condition or damage finding.</p><dl><dt>Parcel PIN</dt><dd>'+e(c.county_pin)+'</dd><dt>Property class</dt><dd>'+e(c.residential?.class)+'</dd><dt>Residential source verified</dt><dd>'+(c.residential?.verified_single_family?'Yes':'No')+'</dd><dt>Aerial status</dt><dd>'+e(a.status)+'</dd><dt>Permit status</dt><dd>'+e(p.status)+'</dd><dt>Matched roof permits</dt><dd>'+e((p.matched_roof_permits||[]).length)+'</dd><dt>Storm evidence</dt><dd>'+e(s.status)+'</dd><dt>Recorded owner</dt><dd>'+source(c.ownership)+'</dd><dt>Valuation</dt><dd>'+source(c.valuation)+'</dd><dt>Roof condition</dt><dd>Not verified</dd><dt>Google Street View</dt><dd>'+maps+'</dd><dt>Evidence flags</dt><dd>'+e((m.flags||[]).join(', ')||'None recorded')+'</dd></dl>'}
function render(){let q=$('q').value.toLowerCase(),tier=$('tier').value;let filtered=cards.filter(c=>(!q||(String(c.address||'')+' '+String(c.county_pin||'')).toLowerCase().includes(q))&&(!tier||c.mindex?.tier===tier));$('count').textContent=' · '+cards.length.toLocaleString()+' indexed parcels';$('list').replaceChildren(...filtered.slice(0,150).map(c=>{let b=document.createElement('button');b.textContent=(c.address||c.county_pin)+' · Tier '+(c.mindex?.tier||'?')+' · '+(c.mindex?.prospecting_priority??'unranked');b.addEventListener('click',()=>detail(c));return b}));$('notice').textContent=filtered.length+' matching properties · showing first '+Math.min(150,filtered.length);if(filtered.length===1)detail(filtered[0])}
$('q').oninput=render;$('tier').onchange=render;fetch('/data/mindex_property_cards.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Evidence feed unavailable ('+r.status+')');return r.json()}).then(d=>{if(!Array.isArray(d.cards)||!d.cards.length)throw Error('No indexed cards');cards=d.cards;render()}).catch(err=>{$('notice').textContent='Unavailable: '+err.message});
</script></body></html>
