name: GateKeeper autonomous live sync regression
on:
  pull_request:
    paths:
      - 'scripts/build-web.mjs'
      - 'collector/repair_source_ledger.py'
      - 'tests/test_source_ledger_recovery.py'
      - '.github/workflows/gatekeeper-restore-ledger.yml'
      - 'tests/test_research_batch_priority.py'
      - 'tests/eagan_permit_request.test.mjs'
      - 'scripts/build_eagan_permit_request.mjs'
      - 'network.html'
      - 'network.js'
      - 'api/property-network.js'
      - 'tests/property_network.test.mjs'
      - 'tests/noaa_storms.test.mjs'
      - 'scripts/ingest_noaa_storms.mjs'
      - 'collector/discover_outward_rings.py'
      - '.github/workflows/aeroleadai-ring-expansion.yml'
      - '.github/workflows/gatekeeper-noaa-storms.yml'
      - 'collector/certification_gap_pipeline.py'
      - 'api/certification-gaps.js'
      - 'certification-gaps.html'
      - 'tests/test_certification_gap_pipeline.py'
      - 'tests/certification_api.test.mjs'
      - 'scripts/retry_evidence_push.sh'
      - 'tests/test_evidence_push_retry.py'
      - 'public/live-sync.js'
      - 'vercel.json'
      - 'collector/source_health_public.py'
      - 'collector/validate_imagery_view_sources.py'
      - 'tests/test_imagery_view_sources.py'
      - '.github/workflows/download-images.yml'
      - 'tests/live_sync_build.test.mjs'
      - 'tests/production_http_smoke.mjs'
      - 'tests/test_source_health_public.py'
      - '.github/workflows/autonomous-live-sync.yml'
      - '.github/workflows/aeroleadai-15min-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-web.mjs'
      - 'collector/repair_source_ledger.py'
      - 'tests/test_source_ledger_recovery.py'
      - '.github/workflows/gatekeeper-restore-ledger.yml'
      - 'tests/test_research_batch_priority.py'
      - 'tests/eagan_permit_request.test.mjs'
      - 'scripts/build_eagan_permit_request.mjs'
      - 'network.html'
      - 'network.js'
      - 'api/property-network.js'
      - 'tests/property_network.test.mjs'
      - 'tests/noaa_storms.test.mjs'
      - 'scripts/ingest_noaa_storms.mjs'
      - 'collector/discover_outward_rings.py'
      - '.github/workflows/aeroleadai-ring-expansion.yml'
      - '.github/workflows/gatekeeper-noaa-storms.yml'
      - 'collector/certification_gap_pipeline.py'
      - 'api/certification-gaps.js'
      - 'certification-gaps.html'
      - 'tests/test_certification_gap_pipeline.py'
      - 'tests/certification_api.test.mjs'
      - 'scripts/retry_evidence_push.sh'
      - 'tests/test_evidence_push_retry.py'
      - 'public/live-sync.js'
      - 'vercel.json'
      - 'collector/source_health_public.py'
      - 'collector/validate_imagery_view_sources.py'
      - 'tests/test_imagery_view_sources.py'
      - '.github/workflows/download-images.yml'
      - 'tests/live_sync_build.test.mjs'
      - 'tests/production_http_smoke.mjs'
      - 'tests/test_source_health_public.py'
      - '.github/workflows/autonomous-live-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-update-path:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify live browser update script parses
        run: node --check public/live-sync.js
      - name: Verify strict production HTTP smoke contract parses
        run: node --check tests/production_http_smoke.mjs
      - name: Rebuild real dashboard and assert permits, roof list and cinematic controls survive
        run: node --test tests/live_sync_build.test.mjs
      - name: Verify NOAA source parsing and storm geographic evidence status
        run: node --test tests/noaa_storms.test.mjs
      - name: Test actual full GIS network and real municipal source matches
        run: node --test tests/property_network.test.mjs
      - name: Parse live property network and browser map scripts
        run: |
          node --check api/property-network.js
          node --check network.js
          node --check scripts/ingest_noaa_storms.mjs
          python -m py_compile collector/discover_outward_rings.py collector/frequent_source_validation.py
      - name: Verify original-60 certification source evidence and fail-closed missing data
        run: python -m unittest discover -s tests -p 'test_certification_gap_pipeline.py' -v
      - name: Validate authenticated source-directed certification search against actual property records
        run: node --test tests/certification_api.test.mjs
      - name: Verify original 60 and GateKeeper source joins
        run: node --test tests/scorecard_integration.test.mjs
      - name: Prove fresh Eagan GIS parcels are researched before repeating old parcels
        run: python -m unittest discover -s tests -p 'test_research_batch_priority.py' -v
      - name: Verify historical official GIS checks survive territory boundaries
        run: python -m unittest discover -s tests -p 'test_source_ledger_recovery.py' -v
      - name: Verify all-parcel City permit public-data request matches actual source inventory
        run: node --test tests/eagan_permit_request.test.mjs
      - name: Verify heartbeat cannot invent municipal verification
        run: python -m unittest discover -s tests -p 'test_source_health_public.py' -v
      - name: Verify no unlicensed aerial image file claims
        run: python -m unittest discover -s tests -p 'test_imagery_view_sources.py' -v
      - name: Check evidence-publisher shell syntax
        run: bash -n scripts/retry_evidence_push.sh
      - name: Prove concurrent commits rebase without loss and conflicts fail closed
        run: python -m unittest discover -s tests -p 'test_evidence_push_retry.py' -v
