name: GateKeeper municipal records request packet
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_eagan_permit_request.mjs'
      - 'tests/eagan_permit_request.test.mjs'
      - '.github/workflows/gatekeeper-eagan-request.yml'
  workflow_dispatch:
  schedule:
    - cron: '12 11 * * *' # after daily Eagan GIS discovery
permissions:
  contents: write
concurrency:
  group: gatekeeper-city-request-records
  cancel-in-progress: false
jobs:
  build-authorized-issuer-request:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check GIS identities, actual permit IDs and all available Eagan addresses
        run: node --test tests/eagan_permit_request.test.mjs
      - name: Produce CSV and coverage evidence (do not submit user identity)
        run: node scripts/build_eagan_permit_request.mjs
      - name: Publish up-to-date city request packet
        run: |
          git config user.name 'AeroLeadAI Evidence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/data/eagan_municipal_record_request_all_parcels.csv evidence/data/eagan_municipal_record_request_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build authorized Eagan public records request packet for full GIS inventory'
            bash scripts/retry_evidence_push.sh
          fi
