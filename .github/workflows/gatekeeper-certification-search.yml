name: GateKeeper certification evidence search and issuer review queue
on:
  pull_request:
    paths:
      - 'collector/certification_gap_pipeline.py'
      - 'tests/test_certification_gap_pipeline.py'
      - 'tests/certification_api.test.mjs'
      - 'tests/certification_sql_contract.test.mjs'
      - 'supabase/migrations/007_gatekeeper_certification_receipts.sql'
      - 'api/certification-gaps.js'
      - 'certification-gaps.html'
      - '.github/workflows/gatekeeper-certification-search.yml'
      - 'evidence/data/municipal_permit_export_audit.json'
  push:
    branches: [main]
    paths:
      - 'collector/certification_gap_pipeline.py'
      - 'tests/test_certification_gap_pipeline.py'
      - 'tests/certification_api.test.mjs'
      - 'tests/certification_sql_contract.test.mjs'
      - 'supabase/migrations/007_gatekeeper_certification_receipts.sql'
      - 'api/certification-gaps.js'
      - 'certification-gaps.html'
      - '.github/workflows/gatekeeper-certification-search.yml'
      - 'evidence/data/municipal_permit_export_audit.json'
  workflow_dispatch:
  schedule:
    - cron: '13 13 * * *'
permissions:
  contents: write
concurrency:
  group: gatekeeper-certification-index
  cancel-in-progress: false
jobs:
  search-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source gates against real 60 source records
        run: python -m unittest discover -s tests -p 'test_certification_gap_pipeline.py' -v
      - name: Build source-backed missing-evidence search index and issuer document packets
        run: python collector/certification_gap_pipeline.py
      - name: Check authenticated certification API JavaScript syntax
        run: node --check api/certification-gaps.js
      - name: Validate authorized search, real 60 source data and 2025 roofing candidate
        run: node --test tests/certification_api.test.mjs
      - name: Verify staged DB reviewer receipt and immutability contract
        run: node --test tests/certification_sql_contract.test.mjs
      - name: Publish research queue, not fake permit completions
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'AeroLeadAI Evidence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidence/data/certification_gap_summary.json evidence/data/certification_gap_queue.json evidence/data/permit_issuer_review_queue.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish factual GateKeeper certification search gaps and Eagan issuer request queue'
            bash scripts/retry_evidence_push.sh
          fi
