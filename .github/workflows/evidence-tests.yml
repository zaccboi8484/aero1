name: Evidence engine tests
on:
  push:
    paths:
      - "collector/match_permits.py"
      - "tests/test_permit_matching.py"
      - "tests/test_supercharger_v2.py"
      - "collector/residential_classifier.py"
      - "collector/aerial_coverage.py"
      - "collector/roof_chip_features.py"
      - "scripts/roof_score_v2.py"
      - ".github/workflows/evidence-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python tests/test_supercharger_v2.py
      - run: python tests/test_permit_matching.py
      - run: python tests/test_gatekeeper_fetch.py
