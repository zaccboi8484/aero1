name: Evidence engine tests
on:
  push:
    paths:
      - "collector/match_permits.py"
      - "tests/test_permit_matching.py"
      - ".github/workflows/evidence-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_permit_matching.py
