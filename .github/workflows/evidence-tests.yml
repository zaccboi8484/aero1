name: Evidence engine tests
on:
  push:
    paths:
      - "collector/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/evidence-tests.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install geopandas rasterio numpy pillow
      - run: pip install scipy
      - run: python tests/test_supercharger_v2.py
      - run: python tests/test_supercharger_v2b.py
      - run: python tests/test_supercharger_v3.py
      - run: python tests/test_footprints.py
      - run: python tests/test_permit_matching.py
      - run: python tests/test_gatekeeper_fetch.py
