name: Independent property intelligence evidence audit
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/autonomous_engine_audit.py"
      - ".github/workflows/autonomous-intelligence-audit.yml"
permissions:
  contents: write
concurrency:
  group: aero-engine-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently validate every parcel and missing permit, storm, imagery, valuation, ownership evidence
        run: python3 scripts/autonomous_engine_audit.py
      - name: Publish evidence gap snapshot
        run: |
          git config user.name "aeroleadai-engine[bot]"
          git config user.email "aeroleadai-engine@users.noreply.github.com"
          git add evidence/data/autonomous_engine_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh autonomous multi-engine evidence gap audit"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 4))
          done
          exit 1
