name: Official Kings Wood parcel acquisition
on:
  push:
    branches: [main]
    paths:
      - 'collector/collect_parcels.py'
      - 'collector/discover_official_sources.py'
      - 'collector/progressive_search.py'
      - 'collector/gatekeeper_release_truth.py'
      - 'collector/build_property_categories.py'
      - 'collector/check_pipeline_integrity.py'
      - 'collector/verify_subdivision_geometry.py'
      - 'collector/probe_county_imagery.py'
      - 'collector/search_regional_residential_permits.py'
      - 'collector/acquire_official_intelligence.py'
      - '.github/workflows/parcel-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: write
concurrency:
  group: parcel-evidence
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve county GIS records
        run: python collector/collect_parcels.py
      - name: Discover official permit and subdivision sources
        run: python collector/discover_official_sources.py
      - name: Run official GIS parcel-center checks
        run: python collector/verify_subdivision_geometry.py
      - name: Acquire public property valuation and weather alerts
        run: python collector/acquire_official_intelligence.py
      - name: Query Metropolitan Council regional residential permits
        run: python collector/search_regional_residential_permits.py
      - name: Probe official county image export availability
        run: python collector/probe_county_imagery.py
      - name: Build per-property GateKeeper progression records
        run: python collector/progressive_search.py
      - name: Generate roofing/tree/driveway property intelligence cards
        run: python collector/build_property_categories.py
      - name: Enforce GateKeeper integrity across parcel cards
        run: |
          python collector/check_pipeline_integrity.py
          node pipeline/gatekeeper-release-gates.mjs
      - name: Publish GateKeeper release truth and human review blockers
        if: always()
        run: python collector/gatekeeper_release_truth.py
      - name: Commit timestamped source evidence and diagnostic failures
        if: always()
        run: |
          git config user.name 'AeroLeadAI Evidence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for evidence in evidence/data/kingswood_parcel_candidates.csv evidence/data/collection_manifest.json evidence/data/official_source_discovery.json evidence/data/progressive_search_status.json evidence/data/live_property_enrichment.json evidence/data/live_acquisition_audit.json evidence/data/gatekeeper_property_audit.json evidence/data/search_retry_queue.json evidence/data/property_category_intelligence.json evidence/data/subdivision_geometry_checks.json evidence/data/pipeline_integrity.json evidence/data/gatekeeper_release_truth.json evidence/data/imagery_source_probe.json evidence/data/regional_residential_permit_matches.json; do
            if test -f "$evidence"; then git add -- "$evidence"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update official Kings Wood parcel candidate evidence"
            bash scripts/retry_evidence_push.sh
          fi
